services:
  - type: web
    name: interviewmate-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_STT_URL
        value: https://api.vachana.ai/stt/v3
      - key: GNANI_TTS_URL
        value: https://api.vachana.ai/api/v1/tts/inference
      - key: GNANI_STT_MODEL
        value: prisma-v3.0
      - key: GNANI_TTS_MODEL
        value: timbre-v2.5
      - key: GNANI_TTS_VOICE
        value: Nalini
